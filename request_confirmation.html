<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Phoenix · Request Confirmation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    :root {
      --bg: #f9fafc; --surface: #ffffff; --text-primary: #1e1e2f; --text-secondary: #4a4a5e;
      --accent-1: #ff8a4c; --accent-2: #ff6b2b; --gradient: linear-gradient(135deg, #ff8a4c, #ff4d4d);
      --border: #eaeef2; --shadow: 0 20px 30px -10px rgba(0,0,0,0.05); --glow: rgba(255,110,64,0.4);
      --navbar-bg: rgba(255,255,255,0.8); --divider-color: #eaeef2;
    }
    body.dark {
      --bg: #12121a; --surface: #1e1e2a; --text-primary: #f0f0fa; --text-secondary: #b0b0c0;
      --accent-1: #ff9f6e; --accent-2: #ff7b3f; --gradient: linear-gradient(135deg, #ff9f6e, #ff5e5e);
      --border: #333344; --shadow: 0 20px 30px -10px rgba(0,0,0,0.7); --glow: rgba(255,140,80,0.6);
      --navbar-bg: rgba(30,30,42,0.9); --divider-color: #333344;
    }
    body { background: var(--bg); color: var(--text-primary); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; width: 100%; flex: 1; }

    /* ===== NAVBAR (موحد) ===== */
    nav {
      position: sticky; top: 0; backdrop-filter: blur(12px); background: var(--navbar-bg);
      border-bottom: 1px solid var(--border); z-index: 100; padding: 0.5rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-area { display: flex; align-items: center; gap: 0.3rem; }
    .logo-area img { height: 40px; width: auto; border-radius: 8px; }
    .logo-text h2 { font-size: 1.2rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo-text span { font-size: 0.7rem; color: var(--text-secondary); display: block; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { text-decoration: none; color: var(--text-primary); font-weight: 500; transition: 0.2s; }
    .nav-links a:hover { color: var(--accent-1); }
    .nav-right { display: flex; align-items: center; gap: 0.8rem; position: relative; }
    .nav-icon { font-size: 1.2rem; color: var(--text-primary); cursor: pointer; transition: 0.2s; }
    .nav-icon:hover { color: var(--accent-1); transform: scale(1.05); }
    .theme-toggle { background: none; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; }
    .profile-badge {
      display: flex; align-items: center; justify-content: center; background: var(--surface);
      border-radius: 50%; width: 40px; height: 40px; border: 1px solid var(--border);
      cursor: pointer; text-decoration: none; color: var(--text-primary); font-weight: 600;
    }
    .profile-badge i { font-size: 1.2rem; }
    .profile-badge:hover { background: var(--accent-1); color: white; }
    .logout-btn {
      background: transparent; border: 1px solid var(--accent-1); color: var(--accent-1);
      padding: 0.3rem 0.9rem; border-radius: 40px; font-weight: 600; cursor: pointer;
      transition: 0.2s; white-space: nowrap;
    }
    .logout-btn:hover { background: var(--accent-1); color: white; box-shadow: 0 0 15px var(--glow); }
    .hamburger { display: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); margin-left: 0.5rem; }

    /* DROPDOWNS */
    .notification-wrapper, .message-wrapper { position: relative; display: inline-flex; align-items: center; }
    .notification-dropdown, .message-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0; width: 340px; max-width: 90vw;
      background: var(--surface); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 1px solid var(--border); z-index: 1001; display: none; flex-direction: column; overflow: hidden;
    }
    .notification-dropdown.show, .message-dropdown.show { display: flex; }
    .dropdown-header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); font-weight: 600; }
    .notifications-list, .messages-list { padding: 1rem; text-align: center; color: var(--text-secondary); }
    .dropdown-footer { padding: 0.8rem; text-align: center; border-top: 1px solid var(--border); }
    .dropdown-footer a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; }
    .dropdown-footer a:hover { color: var(--accent-1); text-decoration: underline; }

    /* Sidebar */
    .sidebar {
      position: fixed; top: 0; left: -100%; width: 250px; height: 100vh; background: var(--surface);
      border-right: 1px solid var(--border); padding: 2rem 1rem; transition: left 0.3s; z-index: 200;
    }
    .sidebar.open { left: 0; }
    .sidebar .close-btn { text-align: right; margin-bottom: 2rem; font-size: 1.5rem; cursor: pointer; }
    .sidebar ul { list-style: none; }
    .sidebar li { margin-bottom: 1.2rem; }
    .sidebar a, .sidebar button {
      text-decoration: none; color: var(--text-primary); font-weight: 500; font-size: 1.1rem;
      display: flex; align-items: center; gap: 0.8rem; background: none; border: none; width: 100%; cursor: pointer;
    }
    .sidebar a:hover, .sidebar button:hover { color: var(--accent-1); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
    .overlay.active { display: block; }

    /* Confirmation Card */
    .confirmation-card {
      background: var(--surface); border-radius: 30px; border: 1px solid var(--border);
      padding: 2.5rem 2rem; text-align: center; box-shadow: var(--shadow);
      margin-top: 2rem;
    }
    .confirmation-icon { font-size: 4rem; color: var(--accent-1); margin-bottom: 1.5rem; }
    .confirmation-card h1 {
      font-size: 2rem; font-weight: 700; margin-bottom: 1rem;
      background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .confirmation-card p { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2rem; }
    .button-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--gradient); color: white; border: none; padding: 0.9rem 2rem;
      border-radius: 60px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px var(--glow);
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
    }
    .btn-outline {
      background: transparent; border: 2px solid var(--accent-1); color: var(--accent-1);
      padding: 0.9rem 2rem; border-radius: 60px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
    }

    /* Footer & Chatbot */
    .simple-footer { margin-top: 3rem; padding: 1rem; text-align: center; border-top: 1px solid var(--divider-color); color: var(--text-secondary); font-size: 0.8rem; }
    .simple-footer a { color: var(--accent-1); text-decoration: none; }
    .chatbot {
      position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 0px;
    }
    .chat-circle {
      width: 56px; height: 56px; background: linear-gradient(145deg, #ff9f4a, #ff4d2e);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 0 15px rgba(255,80,40,0.8), 0 8px 20px rgba(0,0,0,0.2);
      animation: float-glow 2.2s infinite; position: relative;
    }
    .chat-circle img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.6); }
    .chat-circle::after {
      content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%; background: radial-gradient(circle, rgba(255,100,40,0.6), transparent 70%);
      animation: pulse-ring 1.8s infinite; pointer-events: none;
    }
    @keyframes float-glow {
      0% { transform: translateY(0px); box-shadow: 0 0 12px rgba(255,80,40,0.7); }
      50% { transform: translateY(-6px); box-shadow: 0 0 28px rgba(255,100,50,1); }
      100% { transform: translateY(0px); box-shadow: 0 0 12px rgba(255,80,40,0.7); }
    }
    @keyframes pulse-ring {
      0% { opacity: 0.6; transform: scale(1); }
      70% { opacity: 0; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(1.3); }
    }
    .chat-label {
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); color: #ffaa66;
      font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 30px;
      margin-top: 6px; cursor: pointer; border: 1px solid #ff8a4c;
    }
    .chat-box {
      position: absolute; bottom: 80px; right: 0; width: 90vw; max-width: 450px; height: 500px;
      background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.3); display: none; flex-direction: column; overflow: hidden;
    }
    body.dark .chat-box { background: rgba(30,30,42,0.85); }
    .chat-box.show { display: flex; }
    .chat-header { padding: 1rem 1.2rem; background: rgba(0,0,0,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .chat-header h4 { font-weight: 700; color: var(--accent-1); }
    .close-chat { background: none; border: none; font-size: 1.2rem; cursor: pointer; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-message {
      max-width: 85%; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem;
      background: var(--surface); color: var(--text-primary); align-self: flex-start;
      border: 1px solid var(--border);
    }
    .chat-message.bot { background: var(--gradient); color: white; border: none; }
    .chat-input-area { display: flex; padding: 10px; gap: 8px; border-top: 1px solid var(--border); }
    .chat-input-area textarea {
      flex: 1; background: var(--surface); border: none; border-radius: 40px;
      padding: 8px 14px; resize: none; font-size: 0.8rem;
    }
    .chat-input-area button {
      background: var(--gradient); border: none; border-radius: 40px; padding: 0 18px;
      color: white; font-weight: bold; cursor: pointer;
    }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: none; justify-content: space-around; align-items: center; padding: 0.6rem 0.8rem; z-index: 90; }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; color: var(--text-secondary); text-decoration: none; font-size: 0.7rem; transition: 0.2s; }
    .bottom-nav-item i { font-size: 1.3rem; }
    .bottom-nav-item.active, .bottom-nav-item:hover { color: var(--accent-1); }
    @media (max-width: 768px) {
      .nav-links, .nav-right .theme-toggle, .nav-right .notification-wrapper, .nav-right .message-wrapper, .nav-right .logout-btn { display: none; }
      .hamburger { display: block; }
      .confirmation-card { padding: 1.5rem; }
      .button-group .btn-primary, .button-group .btn-outline { flex: 1; text-align: center; justify-content: center; }
      .bottom-nav { display: flex; }
      .chatbot { bottom: 80px; }
    }
    @media (min-width: 769px) { .hamburger { display: none; } .bottom-nav { display: none; } }
  </style>
</head>
<body>

<nav>
  <div class="logo-area">
    <img src="assets/images/photo_2026-02-17_19-01-20.jpg" alt="Phoenix">
    <div class="logo-text"><h2>Phoenix</h2><span>donate & trade</span></div>
  </div>
  <div class="nav-links">
    <a href="dashboard.html">Home</a>
    <a href="market.html">Market</a>
    <a href="donate.html">Donate</a>
    <a href="sell.html">Sell</a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
    <div class="notification-wrapper"><i class="fas fa-bell nav-icon" id="notificationBell"></i></div>
    <div class="message-wrapper"><i class="fas fa-comment-dots nav-icon" id="messageIcon"></i></div>
    <a href="profile.html" class="profile-badge" id="profileBadge"><i class="fas fa-user"></i></a>
    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    <span class="hamburger" id="hamburger">☰</span>
  </div>
</nav>

<div class="sidebar" id="sidebar">
  <div class="close-btn" id="closeSidebar">✕</div>
  <ul>
    <li><a href="dashboard.html">Home</a></li>
    <li><a href="market.html">Market</a></li>
    <li><a href="donate.html">Donate</a></li>
    <li><a href="sell.html">Sell</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="favourites.html">Favorites</a></li>
    <li><a href="settings.html">Settings</a></li>
    <li><button id="sidebarDarkMode"><i class="fas fa-moon"></i> Dark Mode</button></li>
    <li><button id="sidebarLogout"><i class="fas fa-sign-out-alt"></i> Logout</button></li>
  </ul>
</div>
<div class="overlay" id="overlay"></div>

<main class="container">
  <div class="confirmation-card">
    <div class="confirmation-icon"><i class="fas fa-check-circle"></i></div>
    <h1>Request Sent!</h1>
    <p id="confirmationMessage">Processing your request...</p>
    <div class="button-group">
      <a href="#" class="btn-primary" id="goToChatBtn"><i class="fas fa-comment"></i> Go to Chat</a>
      <a href="market.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Back to Market</a>
    </div>
  </div>
</main>

<footer class="simple-footer">Copyright © 2026 Phoenix — <a href="about.html">About</a></footer>

<div class="chatbot">
  <div class="chat-circle" id="chatIcon"><img src="assets/images/photo_2026-02-17_19-01-20.jpg" alt="Phoenix AI"></div>
  <span class="chat-label" id="chatLabel">Ask AI</span>
  <div class="chat-box" id="chatBox">
    <div class="chat-header"><h4><i class="fas fa-feather-alt"></i> Phoenix AI</h4><button class="close-chat" id="closeChatBtn">✕</button></div>
    <div class="chat-messages" id="chatMessages"><div class="chat-message bot">👋 Hi! How can I help?</div></div>
    <div class="chat-input-area"><textarea id="chatInput" placeholder="Type..."></textarea><button id="sendChat">Send</button></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ========== دوال إدارة طلبات التبرع (مطابقة لـ market.html) ==========
  function getDonationRequests() {
    return JSON.parse(localStorage.getItem('donation_requests') || '[]');
  }
  function getCurrentMonthYear() {
    const now = new Date();
    return `${now.getFullYear()}-${now.getMonth() + 1}`;
  }
  function getDonationRequestsCountThisMonth() {
    const requests = getDonationRequests();
    const currentMonth = getCurrentMonthYear();
    return requests.filter(req => req.month === currentMonth).length;
  }
  function canMakeDonationRequest() {
    return getDonationRequestsCountThisMonth() < 3;
  }
  function addDonationRequest(productId, productTitle) {
    if (!canMakeDonationRequest()) return false;
    const requests = getDonationRequests();
    const currentMonth = getCurrentMonthYear();
    requests.push({
      id: Date.now().toString(),
      productId: productId,
      productTitle: productTitle,
      timestamp: new Date().toISOString(),
      month: currentMonth
    });
    localStorage.setItem('donation_requests', JSON.stringify(requests));
    return true;
  }

  // ========== معاملات URL ==========
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');
  const sellerId = urlParams.get('seller_id');

  // ========== جلب بيانات المنتج ==========
  let productTitle = '';
  let sellerName = '';
  if (productId) {
    const products = JSON.parse(localStorage.getItem('userProducts') || '[]');
    const product = products.find(p => p.id == productId);
    if (product) {
      productTitle = product.title || 'Item';
      sellerName = product.seller_name || 'the seller';
    }
  }

  // ========== التحقق من الحد وإضافة الطلب ==========
  const msgEl = document.getElementById('confirmationMessage');
  const chatBtn = document.getElementById('goToChatBtn');

  if (!canMakeDonationRequest()) {
    // تم الوصول للحد الأقصى
    if (msgEl) {
      msgEl.innerHTML = `⚠️ You have reached the maximum of 3 donation requests this month. You cannot request more items until next month.`;
    }
    if (chatBtn) {
      chatBtn.style.opacity = '0.5';
      chatBtn.style.pointerEvents = 'none';
    }
    Swal.fire({
      icon: 'error',
      title: 'Limit Reached',
      text: 'You have already used all 3 donation requests this month. You will be redirected to Market.',
      confirmButtonText: 'OK'
    }).then(() => {
      window.location.href = 'market.html';
    });
    setTimeout(() => window.location.href = 'market.html', 3000);
  } else {
    // إضافة الطلب
    const added = addDonationRequest(productId, productTitle);
    if (added) {
      if (msgEl) {
        msgEl.innerHTML = `Your request for "<strong>${escapeHtml(productTitle)}</strong>" has been sent to ${escapeHtml(sellerName)}.<br>You can now coordinate the pickup via Chat.`;
      }
      if (chatBtn && sellerId) {
        chatBtn.href = `chat.html?seller_id=${encodeURIComponent(sellerId)}&product_id=${encodeURIComponent(productId || '')}&product_title=${encodeURIComponent(productTitle)}`;
      } else if (chatBtn) {
        chatBtn.href = 'chat.html';
      }
    } else {
      if (msgEl) {
        msgEl.innerHTML = `Failed to add donation request. Please try again later.`;
      }
      Swal.fire('Error', 'Something went wrong. Please try again.', 'error');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ========== Dark Mode (تحفظ الحالة) ==========
  const themeToggle = document.getElementById('themeToggle');
  const sidebarDarkBtn = document.getElementById('sidebarDarkMode');
  const savedTheme = localStorage.getItem('phoenix-theme');
  const isDark = savedTheme === 'dark';
  
  function setTheme(isDark) {
    document.body.classList.toggle('dark', isDark);
    themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    if (sidebarDarkBtn) sidebarDarkBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i> Dark Mode' : '<i class="fas fa-moon"></i> Dark Mode';
    localStorage.setItem('phoenix-theme', isDark ? 'dark' : 'light');
  }
  setTheme(isDark);
  
  themeToggle.addEventListener('click', () => setTheme(!document.body.classList.contains('dark')));
  if (sidebarDarkBtn) sidebarDarkBtn.addEventListener('click', () => setTheme(!document.body.classList.contains('dark')));

  // ========== Sidebar ==========
  const hamburger = document.getElementById('hamburger');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const closeSidebarBtn = document.getElementById('closeSidebar');
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
  function closeSidebarFunc() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
  hamburger.addEventListener('click', openSidebar);
  closeSidebarBtn.addEventListener('click', closeSidebarFunc);
  overlay.addEventListener('click', closeSidebarFunc);
  document.querySelectorAll('.sidebar a, .sidebar button').forEach(el => {
    if (el.id !== 'sidebarLogout' && el.id !== 'sidebarDarkMode') el.addEventListener('click', closeSidebarFunc);
  });

  // ========== Logout ==========
  function logout() {
    if (confirm('Are you sure you want to logout?')) {
      localStorage.removeItem('phoenix_token');
      localStorage.removeItem('phoenix_user');
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    }
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('sidebarLogout').addEventListener('click', logout);

  // ========== Notifications & Messages Dropdowns ==========
  let activeDropdown = null;
  
  // إنشاء الـ dropdowns إذا لم تكن موجودة (نضيفها مرة واحدة)
  if (!document.querySelector('.notification-dropdown')) {
    const notifDD = document.createElement('div'); notifDD.className = 'notification-dropdown';
    notifDD.innerHTML = `<div class="dropdown-header">Notifications</div><div class="notifications-list">🔔 No notifications now</div><div class="dropdown-footer"><a href="notifications.html">View all</a></div>`;
    document.body.appendChild(notifDD);
  }
  if (!document.querySelector('.message-dropdown')) {
    const msgDD = document.createElement('div'); msgDD.className = 'message-dropdown';
    msgDD.innerHTML = `<div class="dropdown-header">Messages</div><div class="messages-list">💬 No messages yet</div><div class="dropdown-footer"><a href="chat.html">View all</a></div>`;
    document.body.appendChild(msgDD);
  }
  
  const notifDD = document.querySelector('.notification-dropdown');
  const msgDD = document.querySelector('.message-dropdown');
  
  function closeAllDD() {
    if (notifDD) notifDD.classList.remove('show');
    if (msgDD) msgDD.classList.remove('show');
    activeDropdown = null;
  }
  
  function openDD(dd, icon) {
    closeAllDD();
    if (!dd) return;
    const rect = icon.getBoundingClientRect();
    dd.style.top = (rect.bottom + window.scrollY + 5) + 'px';
    dd.style.right = (window.innerWidth - rect.right - window.scrollX) + 'px';
    dd.classList.add('show');
    activeDropdown = dd;
  }
  
  document.getElementById('notificationBell').addEventListener('click', e => {
    e.stopPropagation();
    if (activeDropdown === notifDD) closeAllDD();
    else openDD(notifDD, e.currentTarget);
  });
  document.getElementById('messageIcon').addEventListener('click', e => {
    e.stopPropagation();
    if (activeDropdown === msgDD) closeAllDD();
    else openDD(msgDD, e.currentTarget);
  });
  
  document.addEventListener('click', e => {
    if (!e.target.closest('.notification-wrapper') && !e.target.closest('.notification-dropdown') &&
        !e.target.closest('.message-wrapper') && !e.target.closest('.message-dropdown')) {
      closeAllDD();
    }
  });

  // ========== Chatbot ==========
  const chatIcon = document.getElementById('chatIcon');
  const chatLabel = document.getElementById('chatLabel');
  const chatBox = document.getElementById('chatBox');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendChat');
  const closeChatBtn = document.getElementById('closeChatBtn');
  function toggleChat() { chatBox.classList.toggle('show'); }
  chatIcon.addEventListener('click', toggleChat);
  chatLabel.addEventListener('click', toggleChat);
  closeChatBtn.addEventListener('click', () => chatBox.classList.remove('show'));
  function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = 'chat-message' + (isUser ? '' : ' bot');
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  sendBtn.addEventListener('click', () => {
    const msg = chatInput.value.trim();
    if (!msg) return;
    addMessage(msg, true);
    chatInput.value = '';
    setTimeout(() => addMessage('Thanks! Phoenix AI will assist you shortly. 🔥'), 500);
  });
  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
  });
  document.addEventListener('click', (e) => {
    if (!chatBox.contains(e.target) && !chatIcon.contains(e.target) && (!chatLabel || !chatLabel.contains(e.target))) {
      chatBox.classList.remove('show');
    }
  });

  // أيقونة البروفايل (تأكد من أنها أيقونة فقط)
  const profileBadge = document.getElementById('profileBadge');
  if (profileBadge) profileBadge.innerHTML = '<i class="fas fa-user"></i>';
})();
</script>
</body>
</html>
