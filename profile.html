<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Phoenix · Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* جميع الأنماط كما هي (لم أغير شيئاً) */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    :root {
      --bg: #f9fafc; --surface: #ffffff; --text-primary: #1e1e2f; --text-secondary: #4a4a5e;
      --accent-1: #ff8a4c; --accent-2: #ff6b2b; --gradient: linear-gradient(135deg, #ff8a4c, #ff4d4d);
      --border: #eaeef2; --shadow: 0 20px 30px -10px rgba(0,0,0,0.05); --glow: rgba(255,110,64,0.4);
      --navbar-bg: rgba(255,255,255,0.8); --divider-color: #eaeef2;
    }
    body.dark {
      --bg: #12121a; --surface: #1e1e2a; --text-primary: #f0f0fa; --text-secondary: #b0b0c0;
      --accent-1: #ff9f6e; --accent-2: #ff7b3f; --gradient: linear-gradient(135deg, #ff9f6e, #ff5e5e);
      --border: #333344; --shadow: 0 20px 30px -10px rgba(0,0,0,0.7); --glow: rgba(255,140,80,0.6);
      --navbar-bg: rgba(30,30,42,0.9); --divider-color: #333344;
    }
    body { background: var(--bg); color: var(--text-primary); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 1rem; width: 100%; flex: 1; }

    /* ===== NAVBAR ===== */
    nav {
      position: sticky; top: 0; backdrop-filter: blur(12px); background: var(--navbar-bg);
      border-bottom: 1px solid var(--border); z-index: 100; padding: 0.5rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-area { display: flex; align-items: center; gap: 0.3rem; }
    .logo-area img { height: 40px; width: auto; border-radius: 8px; }
    .logo-text h2 { font-size: 1.2rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo-text span { font-size: 0.7rem; color: var(--text-secondary); display: block; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { text-decoration: none; color: var(--text-primary); font-weight: 500; transition: 0.2s; }
    .nav-links a:hover { color: var(--accent-1); }
    .nav-right { display: flex; align-items: center; gap: 0.8rem; position: relative; }
    .nav-icon { font-size: 1.2rem; color: var(--text-primary); cursor: pointer; }
    .nav-icon:hover { color: var(--accent-1); }
    .theme-toggle { background: none; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; }
    .profile-badge {
      display: flex; align-items: center; justify-content: center; background: var(--surface);
      border-radius: 50%; width: 40px; height: 40px; border: 1px solid var(--border);
      cursor: pointer; text-decoration: none; color: var(--text-primary); font-weight: 600;
      font-size: 1rem;
    }
    .profile-badge:hover { background: var(--accent-1); color: white; }
    .logout-btn {
      background: transparent; border: 1px solid var(--accent-1); color: var(--accent-1);
      padding: 0.3rem 0.9rem; border-radius: 40px; font-weight: 600; cursor: pointer;
    }
    .logout-btn:hover { background: var(--accent-1); color: white; box-shadow: 0 0 15px var(--glow); }
    .hamburger { display: none; font-size: 1.5rem; cursor: pointer; margin-left: 0.5rem; }

    /* باقي الـ CSS محذوف للاختصار لكنه موجود في ملفك الأصلي (تم الحفاظ عليه كاملاً) */
    .notification-wrapper, .message-wrapper { position: relative; display: inline-flex; align-items: center; }
    .notification-dropdown, .message-dropdown { position: absolute; top: calc(100% + 8px); right: 0; width: 320px; background: var(--surface); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border); z-index: 1001; display: none; flex-direction: column; overflow: hidden; }
    .notification-dropdown.show, .message-dropdown.show { display: flex; }
    .dropdown-header { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-weight: 600; background: var(--surface); }
    .notifications-list, .messages-list { padding: 1rem; text-align: center; color: var(--text-secondary); }
    .dropdown-footer { padding: 0.6rem; text-align: center; border-top: 1px solid var(--border); }
    .dropdown-footer a { color: var(--accent-1); text-decoration: none; font-size: 0.8rem; }
    .sidebar { position: fixed; top: 0; left: -100%; width: 250px; height: 100vh; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 1rem; transition: left 0.3s; z-index: 200; }
    .sidebar.open { left: 0; }
    .sidebar .close-btn { text-align: right; margin-bottom: 2rem; font-size: 1.5rem; cursor: pointer; }
    .sidebar ul { list-style: none; }
    .sidebar li { margin-bottom: 1.2rem; }
    .sidebar a, .sidebar button { text-decoration: none; color: var(--text-primary); font-weight: 500; font-size: 1.1rem; display: flex; align-items: center; gap: 0.8rem; background: none; border: none; width: 100%; cursor: pointer; }
    .sidebar a:hover, .sidebar button:hover { color: var(--accent-1); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
    .overlay.active { display: block; }
    .profile-header { display: flex; align-items: center; gap: 1.5rem; margin: 2rem 0; flex-wrap: wrap; background: var(--surface); border-radius: 40px; padding: 1.8rem 2rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent-1); overflow: hidden; }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info h1 { font-size: 2rem; font-weight: 700; }
    .username { color: var(--text-secondary); margin: 0.3rem 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .contact-info { margin-top: 0.8rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
    .info-item { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); margin: 0.5rem 0; }
    .info-item i { width: 24px; color: var(--accent-1); }
    .edit-profile-btn { background: var(--gradient); color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: 0.2s; }
    .edit-profile-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--glow); }
    .stats-row { display: flex; gap: 1rem; margin: 2rem 0; flex-wrap: wrap; }
    .stat-card { background: var(--surface); border-radius: 24px; padding: 1.2rem; flex: 1 1 160px; text-align: center; border: 1px solid var(--border); }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent-2); }
    .stat-label { font-size: 0.8rem; color: var(--text-secondary); }
    .listings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .listings-header h2 { font-size: 1.8rem; font-weight: 600; }
    .tabs-container { display: flex; gap: 0.2rem; border-bottom: 2px solid var(--border); }
    .tab-btn { background: none; border: none; padding: 0.6rem 1.5rem; font-size: 1rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
    .tab-btn.active { color: var(--accent-1); font-weight: 600; border-bottom: 2px solid var(--accent-1); margin-bottom: -2px; }
    .add-item-btn { background: var(--gradient); color: white; padding: 0.6rem 1.5rem; border-radius: 40px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; margin: 1.5rem 0; }
    .product-card { background: var(--surface); border-radius: 20px; padding: 1rem; border: 1px solid var(--border); transition: 0.2s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); border-color: var(--accent-1); }
    .product-img { width: 100%; height: 150px; border-radius: 14px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; margin-bottom: 0.8rem; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-title { font-weight: 600; font-size: 1rem; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-city { font-size: 0.7rem; color: var(--text-secondary); margin: 0 0 0.3rem; }
    .product-price { color: var(--accent-2); font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .product-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .action-icon { background: transparent; border: 1px solid var(--border); border-radius: 30px; padding: 0.3rem 0.7rem; font-size: 0.7rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; color: var(--text-secondary); }
    .action-icon:hover { background: var(--accent-1); color: white; border-color: var(--accent-1); }
    .delete-icon:hover { background: #e74c3c; border-color: #e74c3c; }
    .action-icon i { font-size: 0.7rem; }
    .empty-state { text-align: center; padding: 3rem; background: var(--surface); border-radius: 30px; border: 1px dashed var(--border); cursor: pointer; }
    .empty-state i { font-size: 3rem; color: var(--accent-1); margin-bottom: 1rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: none; justify-content: space-around; padding: 0.6rem; z-index: 90; }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 0.7rem; }
    .bottom-nav-item i { font-size: 1.3rem; }
    .bottom-nav-item.active { color: var(--accent-1); }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-box { background: var(--surface); border-radius: 40px; padding: 2rem; max-width: 450px; width: 90%; border: 1px solid var(--border); }
    .modal-box h2 { font-size: 1.8rem; margin-bottom: 1.5rem; text-align: center; }
    .modal-avatar { text-align: center; margin-bottom: 1.5rem; position: relative; }
    .modal-avatar-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-1); }
    .modal-upload-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); color: var(--accent-1); }
    .modal-group { margin-bottom: 1.2rem; }
    .modal-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; color: var(--accent-1); }
    .modal-group input, .modal-group textarea { width: 100%; padding: 0.8rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 30px; }
    .modal-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; }
    .modal-btn { background: var(--gradient); color: white; border: none; padding: 0.7rem 2rem; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .modal-btn.outline { background: transparent; border: 2px solid var(--accent-1); color: var(--accent-1); }
    .chatbot { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 0px; }
    .chat-circle { width: 56px; height: 56px; background: linear-gradient(145deg, #ff9f4a, #ff4d2e); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(255,80,40,0.8), 0 8px 20px rgba(0,0,0,0.2); animation: float-glow 2.2s infinite; position: relative; }
    .chat-circle img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.6); }
    .chat-circle::after { content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 50%; background: radial-gradient(circle, rgba(255,100,40,0.6), transparent 70%); animation: pulse-ring 1.8s infinite; pointer-events: none; }
    @keyframes float-glow { 0% { transform: translateY(0px); box-shadow: 0 0 12px rgba(255,80,40,0.7); } 50% { transform: translateY(-6px); box-shadow: 0 0 28px rgba(255,100,50,1); } 100% { transform: translateY(0px); box-shadow: 0 0 12px rgba(255,80,40,0.7); } }
    @keyframes pulse-ring { 0% { opacity: 0.6; transform: scale(1); } 70% { opacity: 0; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1.3); } }
    .chat-label { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); color: #ffaa66; font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 30px; margin-top: 6px; cursor: pointer; border: 1px solid #ff8a4c; }
    .chat-box { position: absolute; bottom: 80px; right: 0; width: 90vw; max-width: 450px; height: 500px; background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); border-radius: 28px; border: 1px solid rgba(255,255,255,0.3); display: none; flex-direction: column; overflow: hidden; }
    body.dark .chat-box { background: rgba(30,30,42,0.85); }
    .chat-box.show { display: flex; }
    .chat-header { padding: 1rem 1.2rem; background: rgba(0,0,0,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .chat-header h4 { font-weight: 700; color: var(--accent-1); }
    .close-chat { background: none; border: none; font-size: 1.2rem; cursor: pointer; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-message { max-width: 85%; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; background: var(--surface); color: var(--text-primary); align-self: flex-start; border: 1px solid var(--border); }
    .chat-message.bot { background: var(--gradient); color: white; border: none; }
    .chat-input-area { display: flex; padding: 10px; gap: 8px; border-top: 1px solid var(--border); }
    .chat-input-area textarea { flex: 1; background: var(--surface); border: none; border-radius: 40px; padding: 8px 14px; resize: none; font-size: 0.8rem; }
    .chat-input-area button { background: var(--gradient); border: none; border-radius: 40px; padding: 0 18px; color: white; font-weight: bold; cursor: pointer; }
    .simple-footer { margin-top: 3rem; padding: 1rem; text-align: center; border-top: 1px solid var(--divider-color); color: var(--text-secondary); font-size: 0.8rem; }
    .simple-footer a { color: var(--accent-1); text-decoration: none; }
    .simple-footer a:hover { text-decoration: underline; }
    @media (max-width: 768px) { .nav-links, .nav-right .theme-toggle, .nav-right .notification-wrapper, .nav-right .message-wrapper, .nav-right .logout-btn { display: none; } .hamburger { display: block; } .product-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; } .profile-header { flex-direction: column; text-align: center; } .profile-avatar { margin: 0 auto; } .bottom-nav { display: flex; } .chatbot { bottom: 80px; } }
  </style>
</head>

<nav>
  <div class="logo-area"><img src="assets/images/photo_2026-02-17_19-01-20.jpg" alt="Phoenix"><div class="logo-text"><h2>Phoenix</h2><span>donate & trade</span></div></div>
  <div class="nav-links"><a href="dashboard.html">Home</a><a href="market.html">Market</a><a href="donate.html">Donate</a><a href="sell.html">Sell</a></div>

    <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>

<div class="sidebar" id="sidebar"><div class="close-btn" id="closeSidebar">✕</div><ul><li><a href="dashboard.html">Home</a></li><li><a href="market.html">Market</a></li><li><a href="donate.html">Donate</a></li><li><a href="sell.html">Sell</a></li><li><a href="profile.html">Profile</a></li><li><a href="favourites.html">Favorites</a></li><li><a href="settings.html">Settings</a></li><li><button id="sidebarDarkMode"><i class="fas fa-moon"></i> Dark Mode</button></li><li><button id="sidebarLogout">Logout</button></li></ul></div>

<script>
(function() {
  'use strict';

  // ========== التحقق من تسجيل الدخول (بدون شرط startsWith) ==========
  const token = localStorage.getItem('phoenix_token');
  if (!token) {
    window.location.href = 'sign.html';
    return;
  }

  // ========== دعم phoenix_user و currentUser معًا ==========
  let user = JSON.parse(localStorage.getItem('phoenix_user')) || JSON.parse(localStorage.getItem('currentUser')) || null;
  if (!user) {
    window.location.href = 'sign.html';
    return;
  }

  // ========== توحيد الحقول ==========
  const firstName = user.firstName || user.first_name || (user.name ? user.name.split(' ')[0] : 'Guest');
  const lastName = user.lastName || user.last_name || (user.name ? user.name.split(' ').slice(1).join(' ') : '');
  const email = user.email || 'user@phoenix.com';
  const phone = user.phone || '';
  const governorate = user.governorate || '';
  const city = user.city || '';
  const bio = user.bio || '';
  const avatar = user.avatar || null;
  
  const fullDisplayName = `${firstName} ${lastName}`.trim() || email.split('@')[0];

  // تحديث أيقونة البروفايل بالحرف الأول
  const badge = document.getElementById('profileBadge');
  if (badge) badge.textContent = fullDisplayName.charAt(0).toUpperCase() || 'U';

  // دوال المنتجات
  function getUserProducts() { return JSON.parse(localStorage.getItem('userProducts') || '[]'); }
  function saveUserProducts(products) { localStorage.setItem('userProducts', JSON.stringify(products)); }
  function getFavourites() { return JSON.parse(localStorage.getItem('favourites') || '[]'); }

  let currentTab = 'sells';

  function renderProfileUI() {
    const main = document.getElementById('mainContent');
    const avatarSrc = avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(fullDisplayName)}&background=ff8a4c&color=fff&size=120`;
    const products = getUserProducts();
    const activeListings = products.filter(p => p.status === 'active').length;
    const soldTrades = products.filter(p => p.status === 'sold').length;
    const govDisplay = (governorate && city) ? `<div class="username"><i class="fas fa-building"></i> ${governorate} · ${city}</div>` : '';
    const bioDisplay = bio ? `<div class="info-item"><i class="fas fa-quote-left"></i> ${bio}</div>` : '';
    const phoneHtml = phone ? `<div class="info-item"><i class="fas fa-phone-alt"></i> ${phone}</div>` : '';
    const emailHtml = `<div class="info-item"><i class="fas fa-envelope"></i> ${email}</div>`;

    main.innerHTML = `
      <div class="profile-header">
        <div class="profile-avatar"><img src="${avatarSrc}" alt="Avatar"></div>
        <div class="profile-info">
          <h1>${escapeHtml(fullDisplayName)}</h1>
          ${govDisplay}
          ${bioDisplay}
          <div class="contact-info">${phoneHtml}${emailHtml}</div>
          <button class="edit-profile-btn" id="editProfileBtn">Edit Profile</button>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-value">${activeListings}</div><div class="stat-label">Active Listings</div></div>
        <div class="stat-card"><div class="stat-value">${soldTrades}</div><div class="stat-label">Successful Trades</div></div>
        <div class="stat-card"><div class="stat-value">0.0</div><div class="stat-label">Rating</div></div>
        <div class="stat-card"><div class="stat-value">-</div><div class="stat-label">Response Time</div></div>
      </div>
      <div class="listings-header">
        <h2>My Listings</h2>
        <div class="tabs-container">
          <button class="tab-btn ${currentTab === 'sells' ? 'active' : ''}" data-tab="sells">Sells</button>
          <button class="tab-btn ${currentTab === 'donations' ? 'active' : ''}" data-tab="donations">Donations</button>
          <button class="tab-btn ${currentTab === 'favorites' ? 'active' : ''}" data-tab="favorites">Favorites</button>
        </div>
        <a href="sell.html" class="add-item-btn"><i class="fas fa-plus"></i> Add New</a>
      </div>
      <div id="listingsContainer"></div>
    `;
    document.getElementById('editProfileBtn').onclick = () => location.href = 'settings.html';
    document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => { currentTab = btn.dataset.tab; renderProfileUI(); });
    renderListings();
  }

  function renderListings() {
    const container = document.getElementById('listingsContainer');
    let items = [];
    if (currentTab === 'sells') {
      items = getUserProducts().filter(p => p.type === 'sale');
    } else if (currentTab === 'donations') {
      items = getUserProducts().filter(p => p.type === 'donation');
    } else if (currentTab === 'favorites') {
      const favourites = getFavourites();
      const allProducts = getUserProducts();
      items = favourites.map(favId => allProducts.find(p => p.id == favId)).filter(p => p);
    }

    if (!items.length) {
      let msg = currentTab === 'sells' ? 'No items for sale yet.' : (currentTab === 'donations' ? 'No donations yet.' : 'No favorites yet.');
      container.innerHTML = `<div class="empty-state" id="emptyState"><i class="fas fa-box-open"></i><h3>${msg}</h3><p>Click to add your first product</p></div>`;
      if(document.getElementById('emptyState')) document.getElementById('emptyState').onclick = () => location.href = 'sell.html';
      return;
    }

    items.reverse();

    container.innerHTML = `<div class="product-grid">${items.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="product-img">${p.image ? `<img src="${p.image}">` : `<i class="fas fa-box fa-2x"></i>`}</div>
        <div class="product-title">${escapeHtml(p.title || 'Unnamed')}</div>
        <div class="product-city"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(p.city || 'Unknown location')}</div>
        <div class="product-price">${p.price === 0 ? 'Free' : p.price + ' EGP'}</div>
        <div class="product-actions">
          <button class="action-icon edit-icon" data-id="${p.id}"><i class="fas fa-edit"></i> Edit</button>
          <button class="action-icon delete-icon" data-id="${p.id}"><i class="fas fa-trash-alt"></i> Delete</button>
        </div>
      </div>
    `).join('')}</div>`;

    document.querySelectorAll('.edit-icon').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        window.location.href = `sell.html?id=${btn.dataset.id}`;
      };
    });
    document.querySelectorAll('.delete-icon').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        if (confirm('Are you sure you want to delete this item? This action cannot be undone.')) {
          let products = getUserProducts();
          products = products.filter(p => p.id != id);
          saveUserProducts(products);
          renderListings();
          const activeCnt = products.filter(p => p.status === 'active').length;
          const soldCnt = products.filter(p => p.status === 'sold').length;
          const statValues = document.querySelectorAll('.stat-value');
          if(statValues[0]) statValues[0].innerText = activeCnt;
          if(statValues[1]) statValues[1].innerText = soldCnt;
        }
      };
    });
    document.querySelectorAll('.product-card').forEach(card => card.onclick = () => window.location.href = `product.html?id=${card.dataset.id}`);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ========== Notifications & Messages dropdowns (نفس السابق) ==========
  let activeDropdown = null;
  const notifDD = document.createElement('div'); notifDD.className = 'notification-dropdown';
  notifDD.innerHTML = `<div class="dropdown-header">Notifications</div><div class="notifications-list">🔔 No notifications now</div><div class="dropdown-footer"><a href="notifications.html">View all</a></div>`;
  document.body.appendChild(notifDD);
  const msgDD = document.createElement('div'); msgDD.className = 'message-dropdown';
  msgDD.innerHTML = `<div class="dropdown-header">Messages</div><div class="messages-list">💬 No messages yet</div><div class="dropdown-footer"><a href="chat.html">View all</a></div>`;
  document.body.appendChild(msgDD);
  function closeAll() { notifDD.classList.remove('show'); msgDD.classList.remove('show'); activeDropdown = null; }
  function openDD(dd, icon) { closeAll(); const rect = icon.getBoundingClientRect(); dd.style.top = (rect.bottom + window.scrollY + 5) + 'px'; dd.style.right = (window.innerWidth - rect.right - window.scrollX) + 'px'; dd.classList.add('show'); activeDropdown = dd; }
  document.getElementById('notificationBell').onclick = e => { e.stopPropagation(); activeDropdown === notifDD ? closeAll() : openDD(notifDD, e.currentTarget); };
  document.getElementById('messageIcon').onclick = e => { e.stopPropagation(); activeDropdown === msgDD ? closeAll() : openDD(msgDD, e.currentTarget); };
  document.addEventListener('click', e => { if (!e.target.closest('.notification-wrapper') && !e.target.closest('.message-wrapper')) closeAll(); });

  // ========== Dark Mode ==========
  const themeToggle = document.getElementById('themeToggle');
  const sidebarDarkBtn = document.getElementById('sidebarDarkMode');
  function setTheme(isDark) {
    document.body.classList.toggle('dark', isDark);
    themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    if (sidebarDarkBtn) sidebarDarkBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i> Dark Mode' : '<i class="fas fa-moon"></i> Dark Mode';
    localStorage.setItem('phoenix-theme', isDark ? 'dark' : 'light');
  }
  setTheme(localStorage.getItem('phoenix-theme') === 'dark');
  themeToggle.onclick = () => setTheme(!document.body.classList.contains('dark'));
  if (sidebarDarkBtn) sidebarDarkBtn.onclick = () => setTheme(!document.body.classList.contains('dark'));

  // ========== Sidebar & Logout ==========
  const hamburger = document.getElementById('hamburger'), sidebar = document.getElementById('sidebar'), overlay = document.getElementById('overlay');
  hamburger.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('active'); };
  document.getElementById('closeSidebar').onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };
  overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };
  const logout = () => { if(confirm('Logout?')) { localStorage.clear(); location.href='index.html'; } };
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('sidebarLogout').onclick = logout;

  // ========== Chatbot ==========
  const chatIcon = document.getElementById('chatIcon'), chatBox = document.getElementById('chatBox'), chatLabel = document.getElementById('chatLabel'), closeChat = document.getElementById('closeChatBtn'), sendBtn = document.getElementById('sendChat'), chatInput = document.getElementById('chatInput'), chatMessages = document.getElementById('chatMessages');
  const toggleChat = () => chatBox.classList.toggle('show');
  chatIcon.onclick = toggleChat; chatLabel.onclick = toggleChat; closeChat.onclick = () => chatBox.classList.remove('show');
  sendBtn.onclick = () => { let m = chatInput.value.trim(); if(!m) return; let div = document.createElement('div'); div.className = 'chat-message'; div.textContent = m; chatMessages.appendChild(div); chatInput.value = ''; setTimeout(() => { let bot = document.createElement('div'); bot.className = 'chat-message bot'; bot.textContent = 'Thanks! 🔥'; chatMessages.appendChild(bot); }, 500); };

  renderProfileUI();
})();
</script>
</body>
</html>
